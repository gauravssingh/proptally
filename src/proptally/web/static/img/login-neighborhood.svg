    <rect x="85" y="468" width="36" height="46" fill="#FFFFFF" rx="2" stroke="#00684A" stroke-width="1.5"/>
    <rect x="88" y="471" width="30" height="40" fill="url(#activeGlass)"/>

    <rect x="136" y="460" width="36" height="8" fill="#00684A" rx="1"/>
    <rect x="140" y="468" width="28" height="74" fill="#00684A" rx="1"/>
    <circle cx="145" cy="505" r="2.5" fill="#FDE047"/>

    <rect x="195" y="458" width="70" height="84" fill="#FFFFFF" rx="3" stroke="#94A3B8" stroke-width="1.5"/>
    <g fill="url(#activeGlass)">
      <rect x="200" y="464" width="12" height="8" rx="1"/>
      <rect x="215" y="464" width="12" height="8" rx="1"/>
      <rect x="230" y="464" width="12" height="8" rx="1"/>
      <rect x="245" y="464" width="12" height="8" rx="1"/>
    </g>
    <line x1="195" y1="486" x2="265" y2="486" stroke="#E2E8F0" stroke-width="1.5"/>
    <line x1="195" y1="506" x2="265" y2="506" stroke="#E2E8F0" stroke-width="1.5"/>

    <g filter="url(#glowPin)" transform="translate(120, 260)">
      <rect x="0" y="0" width="26" height="26" rx="13" fill="#00684A"/>
      <circle cx="13" cy="13" r="4.5" fill="#FFFFFF"/>
      <polygon points="9,22 17,22 13,30" fill="#00684A"/>
