    <rect x="360" y="360" width="28" height="40" fill="#FFFFFF" rx="2" stroke="#00684A" stroke-width="1.5"/>
    <rect x="363" y="363" width="22" height="34" fill="url(#activeGlass)"/>
    <rect x="360" y="424" width="28" height="40" fill="#FFFFFF" rx="2" stroke="#00684A" stroke-width="1.5"/>
