  <g id="highlight-sfh" filter="url(#focusShadow)">
    <rect x="70" y="542" width="215" height="6" fill="#94A3B8"/>
    <rect x="70" y="380" width="125" height="162" fill="#FFFFFF"/>
    <line x1="70" y1="418" x2="195" y2="418" stroke="#F1F5F9" stroke-width="1.5"/>
    <line x1="70" y1="456" x2="195" y2="456" stroke="#F1F5F9" stroke-width="1.5"/>
    <line x1="70" y1="494" x2="195" y2="494" stroke="#F1F5F9" stroke-width="1.5"/>

    <rect x="185" y="425" width="90" height="117" fill="#F8FAFC"/>

    <polygon points="60,382 132.5,308 205,382" fill="#00684A"/>
    <polygon points="175,427 225,382 285,427" fill="#064E3B"/>

    <polygon points="132.5,338 122,358 143,358" fill="#064E3B"/>
    <polygon points="132.5,341 125,356 140,356" fill="#A7F3D0"/>

    <rect x="85" y="398" width="32" height="40" fill="#FFFFFF" rx="2" stroke="#00684A" stroke-width="1.5"/>
    <rect x="88" y="401" width="26" height="34" fill="url(#activeGlass)"/>
    <line x1="101" y1="401" x2="101" y2="435" stroke="#FFFFFF" stroke-width="1.5"/>

