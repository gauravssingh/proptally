<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" style="display:block;">
  <defs>
    <!-- Sky & Sun Ambiance (fading across the entire 1440 width) -->
    <linearGradient id="fullSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D7ECF9"/>
      <stop offset="38%" stop-color="#EAF4FD"/>
      <stop offset="72%" stop-color="#F4FAF7"/>
      <stop offset="100%" stop-color="#E5F3EA"/>
    </linearGradient>

    <!-- Warm Morning Sun -->
    <radialGradient id="sunGlow" cx="42%" cy="17%" r="45%">
      <stop offset="0%" stop-color="#FFFDF2" stop-opacity="0.95"/>
      <stop offset="28%" stop-color="#FEEAA3" stop-opacity="0.45"/>
      <stop offset="68%" stop-color="#FDE68A" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0"/>
    </radialGradient>

    <!-- Lawn & Terrain Gradients -->
    <linearGradient id="groundLawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#76C48F"/>
      <stop offset="45%" stop-color="#489B66"/>
      <stop offset="100%" stop-color="#286940"/>
    </linearGradient>

    <!-- Pavement & Driveway Gradients -->
    <linearGradient id="asphaltRoad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Polished Reflective Window Glass -->
    <linearGradient id="activeGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="50%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>

    <!-- Soft Depth Shadow for Active Portfolio Properties -->
    <filter id="focusShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>

    <!-- Glowing Pin Markers -->
    <filter id="glowPin" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00684A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ================= 1. SKY & NATURAL AMBIANCE ================= -->
  <rect width="1440" height="900" fill="url(#fullSky)"/>
  <circle cx="480" cy="155" r="260" fill="url(#sunGlow)"/>
  <circle cx="480" cy="155" r="44" fill="#FFFFFF" opacity="0.95"/>

  <!-- Distant Ridgelines & Woodlines -->
  <path d="M0,450 Q280,420 580,445 T980,430 L1440,440 L1440,600 L0,600 Z" fill="#A7DCBA" opacity="0.45"/>
  <path d="M0,480 Q320,455 680,475 T1040,465 L1440,470 L1440,640 L0,640 Z" fill="#80C99A" opacity="0.6"/>

  <!-- ================= 2. MUTED NEIGHBORHOOD HOMES ================= -->
  <g id="context-neighborhood" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1.2" opacity="0.65">
    <g transform="translate(15, 375) scale(0.66)">
      <polygon points="50,110 130,40 210,110" fill="#94A3B8"/>
      <rect x="60" y="110" width="140" height="95"/>
      <rect x="80" y="130" width="28" height="35" fill="#E2E8F0"/>
      <rect x="150" y="130" width="28" height="35" fill="#E2E8F0"/>
    </g>
    <g transform="translate(290, 380) scale(0.62)">
      <polygon points="40,110 110,50 180,110" fill="#94A3B8"/>
      <polygon points="170,110 220,70 270,110" fill="#64748B"/>
      <rect x="50" y="110" width="120" height="95"/>
      <rect x="170" y="110" width="90" height="95"/>
      <rect x="75" y="130" width="24" height="32" fill="#E2E8F0"/>
      <rect x="125" y="130" width="24" height="32" fill="#E2E8F0"/>
    </g>
    <g transform="translate(635, 375) scale(0.64)">
      <polygon points="40,105 125,35 210,105" fill="#94A3B8"/>
      <rect x="50" y="105" width="150" height="95"/>
      <rect x="75" y="125" width="30" height="35" fill="#E2E8F0"/>
      <rect x="145" y="125" width="30" height="35" fill="#E2E8F0"/>
      <rect x="110" y="160" width="25" height="40" fill="#64748B"/>
    </g>
  </g>

  <!-- ================= 3. SUBURBAN ROADS & CUL-DE-SAC ================= -->
  <path d="M0,520 Q420,490 940,510 L1440,520 L1440,900 L0,900 Z" fill="url(#groundLawn)"/>
  <path d="M0,660 Q240,620 460,635 T880,670 Q940,700 1200,810 L1440,820 L1440,900 L0,900 Z" fill="url(#asphaltRoad)"/>

  <polygon points="145,545 210,545 240,675 120,675" fill="#E2E8F0"/>
  <polygon points="410,540 495,540 535,665 385,665" fill="#E2E8F0"/>
  <polygon points="770,545 845,545 885,690 750,690" fill="#E2E8F0"/>

  <path d="M0,660 Q240,620 460,635 T880,670 Q940,700 1200,810 L1440,820" stroke="#94A3B8" stroke-width="3" fill="none"/>
  <path d="M0,740 Q260,700 500,715 T900,750 T1300,860 L1440,865" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="16 14" fill="none" opacity="0.6"/>

