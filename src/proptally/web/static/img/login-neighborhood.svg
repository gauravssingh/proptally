      <rect x="1220" y="565" width="12" height="52" fill="#78350F" rx="2"/>
      <circle cx="1228" cy="532" r="52" fill="#14532D"/>
      <circle cx="1205" cy="512" r="36" fill="#15803D"/>
      <circle cx="1252" cy="516" r="32" fill="#16A34A" opacity="0.9"/>
