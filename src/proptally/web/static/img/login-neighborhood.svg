    <line x1="838" y1="490" x2="928" y2="490" stroke="#CBD5E1" stroke-width="1.5"/>
    <line x1="838" y1="512" x2="928" y2="512" stroke="#CBD5E1" stroke-width="1.5"/>

    <g filter="url(#glowPin)" transform="translate(755, 275)">
