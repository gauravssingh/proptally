    <polygon points="815,432 882,374 950,432" fill="#064E3B"/>

    <polygon points="695,468 770,442 845,468" fill="#047857"/>
    <rect x="712" y="468" width="8" height="74" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
    <rect x="825" y="468" width="8" height="74" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>

    <rect x="726" y="406" width="30" height="36" fill="#FFFFFF" rx="2" stroke="#00684A" stroke-width="1.5"/>
    <rect x="729" y="409" width="24" height="30" fill="url(#activeGlass)"/>

    <rect x="780" y="406" width="30" height="36" fill="#FFFFFF" rx="2" stroke="#00684A" stroke-width="1.5"/>
    <rect x="783" y="409" width="24" height="30" fill="url(#activeGlass)"/>

    <rect x="732" y="482" width="38" height="42" fill="#FFFFFF" rx="2" stroke="#00684A" stroke-width="1.5"/>
    <rect x="735" y="485" width="32" height="36" fill="url(#activeGlass)"/>

    <rect x="786" y="476" width="28" height="66" fill="#00684A" rx="2"/>
    <rect x="791" y="482" width="18" height="16" fill="url(#activeGlass)"/>
    <circle cx="791" cy="510" r="2.5" fill="#FDE047"/>

    <rect x="838" y="464" width="90" height="78" fill="#FFFFFF" rx="3" stroke="#94A3B8" stroke-width="1.5"/>
    <g fill="url(#activeGlass)">
