    <rect x="52" y="530" width="8" height="40" fill="#78350F" rx="2"/>
    <circle cx="56" cy="508" r="36" fill="#14532D"/>
    <circle cx="42" cy="492" r="26" fill="#15803D"/>

    <rect x="305" y="525" width="8" height="38" fill="#78350F" rx="2"/>
