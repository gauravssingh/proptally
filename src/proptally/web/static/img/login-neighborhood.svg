    <rect x="612" y="525" width="8" height="40" fill="#78350F" rx="2"/>
    <circle cx="616" cy="498" r="36" fill="#14532D"/>
    <circle cx="602" cy="485" r="26" fill="#15803D"/>

    <rect x="1000" y="555" width="10" height="48" fill="#78350F" rx="2"/>
