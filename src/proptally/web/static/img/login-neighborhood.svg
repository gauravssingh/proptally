    <rect x="424" y="350" width="26" height="40" fill="#FFFFFF" rx="2" stroke="#00684A" stroke-width="1.5"/>
    <rect x="427" y="353" width="20" height="34" fill="url(#activeGlass)"/>
    <rect x="460" y="350" width="26" height="40" fill="#FFFFFF" rx="2" stroke="#00684A" stroke-width="1.5"/>
    <rect x="463" y="353" width="20" height="34" fill="url(#activeGlass)"/>

    <rect x="424" y="416" width="26" height="40" fill="#FFFFFF" rx="2" stroke="#00684A" stroke-width="1.5"/>
    <rect x="427" y="419" width="20" height="34" fill="url(#activeGlass)"/>
    <rect x="460" y="416" width="26" height="40" fill="#FFFFFF" rx="2" stroke="#00684A" stroke-width="1.5"/>
    <rect x="463" y="419" width="20" height="34" fill="url(#activeGlass)"/>

    <rect x="522" y="360" width="28" height="40" fill="#FFFFFF" rx="2" stroke="#00684A" stroke-width="1.5"/>
    <rect x="525" y="363" width="22" height="34" fill="url(#activeGlass)"/>
    <rect x="522" y="424" width="28" height="40" fill="#FFFFFF" rx="2" stroke="#00684A" stroke-width="1.5"/>
    <rect x="525" y="427" width="22" height="34" fill="url(#activeGlass)"/>

    <rect x="362" y="492" width="24" height="46" fill="#1E293B" rx="2"/>
    <rect x="425" y="492" width="24" height="46" fill="#1E293B" rx="2"/>
    <rect x="462" y="492" width="24" height="46" fill="#1E293B" rx="2"/>
    <rect x="524" y="492" width="24" height="46" fill="#1E293B" rx="2"/>

    <g filter="url(#glowPin)" transform="translate(442, 220)">
