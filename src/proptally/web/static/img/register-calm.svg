<svg id="proptallySceneSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" style="display:block;">
  <!-- Animations for the classes named below. They live inside the file because
       this scene is served as an <img>: page CSS cannot reach it. Pins pulse by
       opacity rather than transform, because a CSS transform would override each
       pin group's own translate() attribute and drop it at the origin. -->
  <style>
    @keyframes ptCloudDrift { from { transform: translateX(-14px); } to { transform: translateX(14px); } }
    .cloud-drift-slow { animation: ptCloudDrift 46s ease-in-out infinite alternate; }

    @keyframes ptPinPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.68; } }
    .pin-anim-1 { animation: ptPinPulse 4.6s ease-in-out infinite; }
    .pin-anim-2 { animation: ptPinPulse 4.6s ease-in-out infinite 0.6s; }
    .pin-anim-3 { animation: ptPinPulse 4.6s ease-in-out infinite 1.2s; }

    /* The sun's bloom breathes very slowly; opacity only, because scaling a
       circle would move it away from its own centre. */
    @keyframes ptSunBreathe { 0%, 100% { opacity: 0.86; } 50% { opacity: 1; } }
    .sun-breathe { animation: ptSunBreathe 26s ease-in-out infinite; }

    /* A kite drifting and turning on the thermals. Origin pinned to its own centre:
       the kite sits inside a placement wrapper, so the default transform-origin
       would spin it around the viewBox corner instead. */
    @keyframes ptKite {
      0%, 100% { transform: translate(0, 0) rotate(-7deg); }
      30%      { transform: translate(16px, -12px) rotate(5deg); }
      60%      { transform: translate(-10px, -21px) rotate(-4deg); }
      80%      { transform: translate(-16px, -6px) rotate(6deg); }
    }
    .kite { animation: ptKite 27s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }

    /* Birds cross the whole sky once a minute and a half; no flapping, since at
       this size the silhouette is what reads. */
    @keyframes ptBirds { from { transform: translate(-90px, 0); } to { transform: translate(1560px, -20px); } }
    .bird-flock { animation: ptBirds 96s linear infinite; }

    /* Traffic on the road, in the near lane. Sampled from the asphalt's own outer
       kerb plus the lane offset, because eyeballed values drift off the road at the
       flanks where the curve is steepest. The 0% and 8% pair is a held pause at the
       left so pass-bys land minutes apart, not on a metronome. */
    @keyframes ptDrive {
      0%    { transform: translate(-60px, 1006px) rotate(-24deg); }
      8%    { transform: translate(-60px, 1006px) rotate(-24deg); }
      16%   { transform: translate(96px, 820px) rotate(-24deg); }
      28%   { transform: translate(252px, 729px) rotate(-20deg); }
      40%   { transform: translate(408px, 685px) rotate(-13deg); }
      52%   { transform: translate(564px, 672px) rotate(-2deg); }
      64%   { transform: translate(720px, 689px) rotate(6deg); }
      76%   { transform: translate(876px, 743px) rotate(15deg); }
      88%   { transform: translate(1032px, 837px) rotate(22deg); }
      100%  { transform: translate(1188px, 966px) rotate(26deg); }
    }
    .road-car { animation: ptDrive 50s linear infinite; }

    /* CSS transforms on SVG elements default to rotating about the middle of the
       viewBox, which would slide these off their keyframes. Anchor them to the
       user-space origin so the translate values mean what they say. Safe for the
       road car because it is not inside a translated wrapper. */
    .bird-flock, .road-car { transform-box: view-box; transform-origin: 0 0; }

    @media (prefers-reduced-motion: reduce) {
      .cloud-drift-slow, .pin-anim-1, .pin-anim-2, .pin-anim-3,
      .sun-breathe, .kite, .bird-flock, .road-car { animation: none; }
    }
  </style>

  <defs>
    <!-- Atmospheric Morning Sky Gradient -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#89B4CC"/>
      <stop offset="32%" stop-color="#B0D0E0"/>
      <stop offset="65%" stop-color="#D6E6E8"/>
      <stop offset="100%" stop-color="#E8EFE6"/>
    </linearGradient>

    <!-- Warm Morning Sun Bloom (Top Right) -->
    <radialGradient id="sunBloom" cx="84%" cy="20%" r="38%">
      <stop offset="0%" stop-color="#FFFDF5" stop-opacity="0.98"/>
      <stop offset="22%" stop-color="#FDE68A" stop-opacity="0.65"/>
      <stop offset="52%" stop-color="#FCD34D" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0"/>
    </radialGradient>

    <!-- Center Form Legibility Halo (Soft Atmospheric Brightening behind Login Area) -->
    <radialGradient id="centerContrastHalo" cx="50%" cy="42%" r="32%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.78"/>
      <stop offset="48%" stop-color="#F8FAFC" stop-opacity="0.45"/>
      <stop offset="78%" stop-color="#E2F1F8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#E2F1F8" stop-opacity="0"/>
    </radialGradient>

    <!-- Distant & Mid-Ground Rolling Hill Gradients -->
    <linearGradient id="distantRidgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94BDA8"/>
      <stop offset="100%" stop-color="#76A48D"/>
    </linearGradient>
    <linearGradient id="midValleyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7BB08E"/>
      <stop offset="100%" stop-color="#558E6B"/>
    </linearGradient>

    <!-- Foreground Rich Lawn Gradients -->
    <linearGradient id="lawnLeftGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#68B678"/>
      <stop offset="45%" stop-color="#48965A"/>
      <stop offset="100%" stop-color="#2D6E3E"/>
    </linearGradient>
    <linearGradient id="lawnRightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5CA86E"/>
      <stop offset="50%" stop-color="#3E8450"/>
      <stop offset="100%" stop-color="#235732"/>
    </linearGradient>

    <!-- Sweeping Suburban Asphalt Road Gradient -->
    <linearGradient id="asphaltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="45%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Concrete Driveway & Curb Gradient -->
    <linearGradient id="concreteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Active Portfolio Window Glass Reflection -->
    <linearGradient id="activeWindowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="40%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>

    <!-- Glowing Emerald Location Pin Gradient -->
    <linearGradient id="pinBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="55%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Radial Green Halo Behind Location Pins -->
    <radialGradient id="pinHaloGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.7"/>
      <stop offset="55%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <!-- Architectural Drop Shadow for Active Portfolio Homes. The sun sits at the
         upper right (1210,185), so shadows fall down and to the left; a straight
         downward offset said the light was overhead. The filter region is widened
         to the left to leave room for the offset and its blur. -->
    <filter id="activeHouseShadow" x="-15%" y="-10%" width="130%" height="125%">
      <feDropShadow dx="-8" dy="12" stdDeviation="9" flood-color="#0F172A" flood-opacity="0.32"/>
    </filter>

    <!-- Soft Shadow for Neutral Background Homes -->
    <filter id="neutralHouseShadow" x="-22%" y="-5%" width="144%" height="115%">
      <feDropShadow dx="-4" dy="5" stdDeviation="4" flood-color="#1E293B" flood-opacity="0.15"/>
    </filter>

    <!-- Shade lying on grass. A radial gradient rather than a blurred ellipse: at
         these sizes a blur spreads the alpha so thin the shadow stops being visible
         at all, which is what measuring the rendered pixels showed - 2 to 6 levels
         out of 255 against 6 to 24 for the houses. -->
    <radialGradient id="groundShade">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#0F172A" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>

    <!-- One leaf, drawn once: blade, midrib, stem. The blade takes the colour of
         whichever element uses it, so the pile can mix ambers while the rib and
         stem stay constant. A leaf this size needs the stem and the rib to read as
         a leaf at all - a bare lens reads as a speck. -->
    
  </defs>

  <!-- ================= 1. SKY, SUN & ATMOSPHERIC HALO ================= -->
  <rect width="1440" height="900" fill="url(#skyGradient)"/>

  <!-- Warm Morning Sun (Top Right) -->
  <circle class="sun-breathe" cx="1210" cy="185" r="310" fill="url(#sunBloom)"/>
  <circle cx="1210" cy="185" r="105" fill="#FEF9C3" opacity="0.35"/>
  <circle cx="1210" cy="185" r="56" fill="#FFFBEB" opacity="0.92"/>

  <!-- Soft Drifting Clouds -->
  <g class="cloud-drift-slow" fill="#FFFFFF" opacity="0.42">
    <path d="M190,140 Q210,120 238,128 Q262,108 294,122 Q320,120 332,138 Q348,140 348,154 L175,154 Q162,154 168,142 Z"/>
    <path d="M880,115 Q902,94 932,104 Q958,86 990,100 Q1015,98 1028,118 L865,118 Q854,118 862,110 Z"/>
  </g>

  <!-- A kite riding the thermals over the left-hand roofs. The wrapper carries the
       placement and the inner group the animation, because a CSS transform would
       otherwise overwrite the transform attribute. -->
  <g transform="translate(330 176)">
    
  </g>

  <!-- Birds, crossing the sky once a minute. Silhouettes only: at this size the
       shape is what reads, so they do not flap. -->
  

  <!-- Distant Rolling Hills -->
  <path d="M0,505 Q260,468 560,515 T1060,492 T1440,502 L1440,650 L0,650 Z" fill="url(#distantRidgeGrad)" opacity="0.7"/>
  <path d="M0,535 Q340,498 720,548 T1180,520 L1440,535 L1440,680 L0,680 Z" fill="url(#midValleyGrad)" opacity="0.85"/>

  <!-- ========================================================================= -->
  <!-- 2. NEUTRAL / GRAYISH (NON-HIGHLIGHTED) BACKGROUND NEIGHBORHOOD HOUSES     -->
  <!-- ========================================================================= -->
  

  <!-- Subtle Neutral Driveways for Background Valley Homes -->
  <g fill="#CBD5E1" opacity="0.45">
    <polygon points="1220,516 1246,516 1265,565 1235,565"/>
  </g>

  <!-- ================= 3. FOREGROUND HILLS, DRIVEWAYS & CURVED ROAD ================= -->
  <path d="M580,565 Q940,485 1440,525 L1440,900 L520,900 Z" fill="url(#lawnRightGrad)"/>
  <path d="M0,535 Q320,505 680,565 T1440,635 L1440,900 L0,900 Z" fill="url(#lawnLeftGrad)"/>

  

  <!-- A car parked in the first house's driveway. Rear view, square to the garage,
       and flat: the scene's vehicles are 2D sprites, so an extruded one read as a
       different object pasted into the street. -->
  

  <path d="M-40,900 C60,720 260,615 540,605 C780,598 980,695 1190,900 L860,900 C730,775 590,695 430,702 C250,710 130,805 65,900 Z" fill="url(#asphaltGrad)"/>

  <path d="M-40,900 C60,720 260,615 540,605 C780,598 980,695 1190,900" fill="none" stroke="#CBD5E1" stroke-width="6"/>
  <path d="M-40,900 C60,720 260,615 540,605 C780,598 980,695 1190,900" fill="none" stroke="#64748B" stroke-width="1.5"/>
  <path d="M65,900 C130,805 250,710 430,702 C590,695 730,775 860,900" fill="none" stroke="#CBD5E1" stroke-width="6"/>

  <path d="M65,900 C130,805 250,710 430,702 C590,695 730,775 860,900 Z" fill="url(#lawnLeftGrad)"/>

  <!-- Traffic on the crescent, in the near lane and drawn at 1.4x because it is the
       closest vehicle in the scene. Filled shapes only: line art this size
       dissolves. The keyframes trace the asphalt's own kerb. -->
  

  <!-- ========================================================================= -->
  <!-- 4. HIGHLIGHTED PORTFOLIO PROPERTY 1: 2-STORY SINGLE-FAMILY HOME (LEFT)    -->
  <!-- ========================================================================= -->
  

  <!-- ========================================================================= -->
  <!-- 5. HIGHLIGHTED PORTFOLIO PROPERTY 2: ATTACHED MULTI-FAMILY TOWNHOMES      -->
  <!-- ========================================================================= -->
  

  <!-- ========================================================================= -->
  <!-- 6. HIGHLIGHTED PORTFOLIO PROPERTY 3: SUBURBAN CRAFTSMAN BUNGALOW (RIGHT)  -->
  <!-- ========================================================================= -->
  

  <!-- ================= 7. TREES, SHRUBS & FOREGROUND FOLIAGE ================= -->
  <g id="suburban-trees-and-shrubs">
    <!-- Contact shadows, offset down and left the way the houses' drop shadows now
         fall. Only where the ground under a tree is actually visible: the ridge
         tree at the far left stands behind a nearer tree's canopy, so its shade
         would never have been seen, and it is left out. -->
    <g fill="url(#groundShade)">
      <ellipse cx="912" cy="545" rx="30" ry="9"/>
      <ellipse cx="46" cy="742" rx="36" ry="10"/>
      <ellipse cx="1272" cy="758" rx="56" ry="16"/>
      <ellipse cx="62" cy="564" rx="18" ry="6"/>
      <ellipse cx="242" cy="574" rx="22" ry="7"/>
      <ellipse cx="270" cy="576" rx="14" ry="5"/>
    </g>

    <rect x="24" y="485" width="9" height="82" fill="#6E4730" rx="2"/>
    <circle cx="28" cy="458" r="38" fill="#235732"/>
    <circle cx="12" cy="442" r="28" fill="#347846"/>
    <circle cx="44" cy="446" r="26" fill="#48965A"/>

    <ellipse cx="82" cy="548" rx="22" ry="12" fill="#2D6E3E"/>
    <ellipse cx="268" cy="554" rx="26" ry="14" fill="#235732"/>
    <ellipse cx="292" cy="558" rx="18" ry="10" fill="#347846"/>

    <rect x="928" y="468" width="8" height="72" fill="#5A3A28" rx="2"/>
    <circle cx="932" cy="442" r="34" fill="#235732"/>
    <circle cx="918" cy="428" r="24" fill="#347846"/>

    <rect x="1202" y="455" width="10" height="95" fill="#5A3A28" rx="2"/>
    <circle cx="1207" cy="418" r="44" fill="#235732"/>
    <circle cx="1188" cy="402" r="32" fill="#347846"/>
    <circle cx="1226" cy="406" r="28" fill="#48965A"/>

    <rect x="52" y="645" width="12" height="95" fill="#5A3A28" rx="2"/>
    <circle cx="58" cy="608" r="46" fill="#1E4D2B"/>
    <circle cx="38" cy="592" r="34" fill="#2D6E3E"/>
    <circle cx="78" cy="596" r="32" fill="#48965A"/>

    <rect x="1282" y="625" width="14" height="125" fill="#5A3A28" rx="2"/>
    <circle cx="1289" cy="572" r="56" fill="#1E4D2B"/>
    <circle cx="1264" cy="552" r="40" fill="#2D6E3E"/>
    <circle cx="1315" cy="556" r="38" fill="#3E8450"/>

    <path d="M1080,900 Q1110,855 1155,865 Q1195,825 1250,848 Q1295,815 1350,845 Q1395,830 1440,860 L1440,900 Z" fill="#1A4225"/>
  </g>

  <!-- Leaves gathered at the foot of the big tree. Static: the falling ones were
       taken out because the animation drew more attention than the scenery should
       ask for. -->
  

  <!-- ========================================================================= -->
  <!-- 8. GLOWING GREEN PORTFOLIO LOCATION PINS (ONLY ON THE 3 INSPIRED HOMES)   -->
  <!-- ========================================================================= -->
  <g id="telemetry-badges-group">
    

    

    
  </g>

  <!-- ================= 9. CENTER CONTRAST RADIAL HALO FOR LOGIN LEGIBILITY ================= -->
  <ellipse cx="720" cy="365" rx="340" ry="250" fill="url(#centerContrastHalo)"/>
<style>/* Calm variant: the artwork is still, by construction. */*{animation:none!important;transition:none!important}</style></svg>
