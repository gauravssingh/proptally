<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1290" width="1200" height="1290"
     role="img" aria-label="Illustration: a modern residential complex at sunrise with landscaped paths, hedges and trees, with translucent portfolio screens floating over it">
  <title>A residential complex in morning light, with portfolio screens floating over it</title>

  <!-- Composed for the panel's ~0.93 aspect so `cover` barely crops it. The
       floating screens sit in the central band, which survives every crop. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ed3ef"/>
      <stop offset="0.3" stop-color="#cfe8f6"/>
      <stop offset="0.62" stop-color="#f6eed6"/>
      <stop offset="1" stop-color="#fbe3b4"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d6" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#fcd97a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fcd97a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc78a"/>
      <stop offset="0.45" stop-color="#3f9a63"/>
      <stop offset="1" stop-color="#1d6b45"/>
    </linearGradient>
    <linearGradient id="facadeCool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b7cad9"/>
    </linearGradient>
    <linearGradient id="facadeWarm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#d8c9ae"/>
    </linearGradient>

    <pattern id="windows" width="52" height="60" patternUnits="userSpaceOnUse">
      <rect x="10" y="12" width="32" height="32" rx="3" fill="#6f9dc8"/>
      <rect x="10" y="12" width="32" height="13" rx="3" fill="#cfe6f8" opacity="0.85"/>
      <rect x="10" y="45" width="32" height="4" rx="2" fill="#ffffff" opacity="0.5"/>
    </pattern>
    <pattern id="windowsWarm" width="58" height="66" patternUnits="userSpaceOnUse">
      <rect x="11" y="13" width="36" height="36" rx="3" fill="#8cadc9"/>
      <rect x="11" y="13" width="36" height="14" rx="3" fill="#f4e6c4"/>
      <rect x="11" y="50" width="36" height="4" rx="2" fill="#ffffff" opacity="0.45"/>
    </pattern>
    <pattern id="mullions" width="120" height="124" patternUnits="userSpaceOnUse">
      <rect width="120" height="7" fill="#ffffff" opacity="0.55"/>
    </pattern>

    <!-- Interface chrome: opaque enough to read as software over the scene. -->
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#eef6ff" stop-opacity="0.34"/>
    </linearGradient>
    <pattern id="blueprint" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#93b8d9" stroke-width="1.2" opacity="0.65"/>
    </pattern>
  </defs>

  <rect width="1200" height="1290" fill="url(#sky)"/>
  <circle cx="925" cy="230" r="360" fill="url(#sun)"/>

  <!-- Distant tree line -->
  <path d="M0 812c130-30 215-6 330-34s195-46 305-24 250 42 360 24 205-32 205-32v122H0z"
        fill="#7dba8e" opacity="0.6"/>

  <!-- Residential blocks -->
  <g>
    <rect x="58" y="392" width="292" height="470" rx="10" fill="url(#facadeWarm)"/>
    <rect x="58" y="392" width="292" height="470" rx="10" fill="url(#windowsWarm)"/>
    <rect x="58" y="392" width="292" height="470" rx="10" fill="url(#mullions)"/>
    <rect x="58" y="392" width="292" height="26" fill="#ffffff" opacity="0.75"/>
    <rect x="45" y="850" width="318" height="18" rx="7" fill="#ddd2ba"/>

    <rect x="418" y="246" width="372" height="616" rx="12" fill="url(#facadeCool)"/>
    <rect x="418" y="246" width="372" height="616" rx="12" fill="url(#windows)"/>
    <rect x="418" y="246" width="372" height="616" rx="12" fill="url(#mullions)"/>
    <rect x="418" y="246" width="372" height="30" fill="#ffffff" opacity="0.8"/>
    <rect x="404" y="850" width="400" height="20" rx="8" fill="#cdd9e4"/>

    <rect x="848" y="452" width="300" height="410" rx="10" fill="url(#facadeWarm)"/>
    <rect x="848" y="452" width="300" height="410" rx="10" fill="url(#windowsWarm)"/>
    <rect x="848" y="452" width="300" height="410" rx="10" fill="url(#mullions)"/>
    <rect x="848" y="452" width="300" height="24" fill="#ffffff" opacity="0.75"/>
    <rect x="836" y="850" width="318" height="18" rx="7" fill="#ddd2ba"/>
  </g>

  <!-- Ground, path, planting -->
  <rect y="862" width="1200" height="428" fill="url(#lawn)"/>
  <path d="M-30 1290c190-142 316-196 442-286s214-134 350-152 320 26 470 68v370z"
        fill="#fbf8f1" opacity="0.95"/>
  <path d="M-30 1290c190-142 316-196 442-286s214-134 350-152 320 26 470 68v370z"
        fill="none" stroke="#ded6c4" stroke-width="7"/>
  <path d="M96 1290c150-96 250-140 360-214" fill="none" stroke="#2b8a55" stroke-width="4" opacity="0.35"/>

  <g>
    <rect x="-20" y="906" width="470" height="62" rx="16" fill="#1f6b45"/>
    <rect x="-20" y="906" width="470" height="22" rx="11" fill="#4fae74" opacity="0.9"/>
    <rect x="742" y="968" width="500" height="56" rx="14" fill="#1f6b45"/>
    <rect x="742" y="968" width="500" height="20" rx="10" fill="#4fae74" opacity="0.9"/>
  </g>

  <g fill="#155e3b">
    <circle cx="176" cy="1042" r="88"/>
    <circle cx="250" cy="1088" r="66"/>
    <circle cx="1046" cy="1086" r="80"/>
    <circle cx="972" cy="1126" r="60"/>
  </g>
  <g fill="#2f8d58">
    <circle cx="154" cy="1020" r="62"/>
    <circle cx="962" cy="1064" r="58"/>
  </g>
  <g fill="#6b4a2f">
    <rect x="168" y="1114" width="18" height="102" rx="7"/>
    <rect x="1038" y="1152" width="16" height="92" rx="6"/>
  </g>

  <!-- Translucent portfolio screens: a chart, a listing, a floor plan -->
  <g>
    <g transform="translate(152 470)">
      <rect width="352" height="228" rx="18" fill="url(#panel)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.9"/>
      <rect x="24" y="26" width="128" height="11" rx="5" fill="#0f172a" opacity="0.45"/>
      <rect x="24" y="48" width="66" height="8" rx="4" fill="#0f172a" opacity="0.25"/>
      <g fill="#0f766e">
        <rect x="26" y="150" width="28" height="46" rx="5" opacity="0.95"/>
        <rect x="66" y="120" width="28" height="76" rx="5" opacity="0.85"/>
        <rect x="106" y="136" width="28" height="60" rx="5" opacity="0.9"/>
        <rect x="146" y="98" width="28" height="98" rx="5" opacity="0.8"/>
        <rect x="186" y="128" width="28" height="68" rx="5" opacity="0.9"/>
        <rect x="226" y="112" width="28" height="84" rx="5" opacity="0.85"/>
      </g>
      <path d="M26 132l40-22 40 12 40-32 40 10 40-26 40 8"
            fill="none" stroke="#134e4a" stroke-width="3" opacity="0.55"/>
    </g>

    <g transform="translate(696 598)">
      <rect width="344" height="242" rx="18" fill="url(#panel)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.9"/>
      <rect x="24" y="28" width="96" height="11" rx="5" fill="#0f172a" opacity="0.45"/>
      <g fill="#0f172a" opacity="0.3">
        <rect x="24" y="62" width="296" height="13" rx="6"/>
        <rect x="24" y="92" width="296" height="13" rx="6" opacity="0.85"/>
        <rect x="24" y="122" width="296" height="13" rx="6"/>
        <rect x="24" y="152" width="296" height="13" rx="6" opacity="0.85"/>
        <rect x="24" y="182" width="186" height="13" rx="6"/>
      </g>
      <g fill="#047857">
        <circle cx="286" cy="68" r="8"/>
        <circle cx="286" cy="98" r="8"/>
        <circle cx="286" cy="128" r="8"/>
      </g>
    </g>

    <g transform="translate(452 986)">
      <rect width="306" height="196" rx="18" fill="url(#panel)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.9"/>
      <rect x="18" y="18" width="270" height="160" rx="10" fill="url(#blueprint)"/>
      <path d="M50 38h206v120H50z" fill="none" stroke="#0f172a" stroke-width="2.5" opacity="0.5"/>
      <path d="M50 100h206M153 38v120" fill="none" stroke="#0f172a" stroke-width="2" opacity="0.35"/>
      <path d="M153 100h103v58" fill="none" stroke="#0f172a" stroke-width="1.6" opacity="0.28"/>
      <rect x="70" y="52" width="46" height="30" rx="3" fill="#047857" opacity="0.55"/>
      <rect x="170" y="52" width="66" height="30" rx="3" fill="#047857" opacity="0.35"/>
    </g>
  </g>
</svg>
