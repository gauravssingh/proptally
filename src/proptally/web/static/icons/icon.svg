<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#1e293b" stroke-width="4"/>
  <!-- App Icon Emblem (Stylized Building + 'P') -->
  <g filter="url(#shadow)">
    <!-- Emerald Door Badge -->
    <rect x="120" y="112" width="272" height="288" rx="40" fill="url(#accent)"/>
    <!-- Capital 'P' Letterform -->
    <path d="M 212 184 L 272 184 C 304 184 324 200 324 232 C 324 264 304 280 272 280 L 252 280 L 252 328 L 212 328 Z M 252 220 L 252 244 L 270 244 C 279 244 284 239 284 232 C 284 225 279 220 270 220 Z" fill="#020617"/>
  </g>
</svg>
