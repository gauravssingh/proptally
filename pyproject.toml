[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proptally"
version = "0.1.0"
description = "Bespoke property, mortgage, and cash flow reconciliation platform for real estate investors."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24.0",
    "pydantic>=2.0.0",
    "python-dateutil>=2.8.2",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.16",
    "watchfiles>=0.21.0",
    "jinja2>=3.1.3",
    "httpx>=0.27.0",
    # Password hashing for self-hosted accounts. Argon2id is the algorithm named by
    # docs/architecture/v2/06_SECURITY_AND_DEPLOYMENT.md §3.1.
    "argon2-cffi>=23.1.0",
]

[project.optional-dependencies]
# Test and static-analysis tooling. The suite itself only needs pytest; ruff is
# advisory (see .github/workflows/tests.yml) because the repository has a
# pre-existing lint baseline that is not part of this milestone.
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
proptally-ingest = "proptally.ingestion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# A real gate: pyflakes (undefined names, unused imports) plus import order and
# the syntax-error rules. Style-only rules that the pre-existing code does not
# satisfy are deliberately not selected.
select = ["E4", "E7", "E9", "F", "I"]
# E741 (single-letter names) and E712 (SQLAlchemy `== True` comparisons) are
# pervasive in the query code and have no behavioural effect.
ignore = ["E741", "E712"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"tools/*" = ["E402"]
"scripts/*" = ["E402"]
