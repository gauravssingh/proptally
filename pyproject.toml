[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proptally"
version = "0.1.0"
description = "Bespoke property, mortgage, and cash flow reconciliation platform for real estate investors."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24.0",
    "pydantic>=2.0.0",
    "python-dateutil>=2.8.2",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.16",
    "watchfiles>=0.21.0",
    "jinja2>=3.1.3",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Test and static-analysis tooling. The suite itself only needs pytest; ruff is
# advisory (see .github/workflows/tests.yml) because the repository has a
# pre-existing lint baseline that is not part of this milestone.
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
proptally-ingest = "proptally.ingestion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
